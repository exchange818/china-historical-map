<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三千年的邻居 · 以中原为轴心的古代世界</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23A33B22'/><circle cx='16' cy='16' r='6.5' fill='none' stroke='%23E8E3D6' stroke-width='1.6'/><circle cx='16' cy='16' r='1.8' fill='%23E8E3D6'/></svg>">
<style>
:root{
  --paper:#E8E3D6;
  --paper-2:#DED7C6;
  --water:#D3CBB7;
  --ink:#23211C;
  --ink-2:#544E45;
  --ink-3:#8C8478;
  --line:#BFB7A3;
  --line-2:#A79E89;
  --zhu:#9E3A20;
  --grass:#63743F;
  --sand:#A7812F;
  --pine:#3E6470;
  --vine:#6E5378;
  --sea:#2A6A66;
  --far:#494F6B;
  --f-display:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;
  --f-body:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
  --f-num:"Iowan Old Style","Georgia","Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(58,48,32,.06) .55px,transparent .55px);
  background-size:3px 3px;
}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

/* ============ 页眉 ============ */
.head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding:14px 16px 10px;border-bottom:1px solid var(--line-2);
}
.head-l{min-width:0;flex:1 1 auto}
.eyebrow{
  font-family:var(--f-display);font-size:11px;letter-spacing:.34em;color:var(--ink-3);
  margin-bottom:6px;
}
.eyebrow span{letter-spacing:0}
h1{
  font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4.6vw,42px);
  line-height:1.06;letter-spacing:.02em;color:var(--ink);
}
.h1row{display:flex;align-items:center;gap:clamp(10px,1.7vw,16px);flex-wrap:wrap}
.h1row .btn.play{padding:8px 16px;font-size:12.5px;letter-spacing:.16em}
.sub{
  font-family:var(--f-display);font-size:clamp(11px,1.6vw,13.5px);color:var(--ink-2);
  letter-spacing:.06em;margin-top:7px;
}
.head-r{text-align:right;flex:0 0 auto;padding-bottom:2px}
.era{
  font-family:var(--f-display);font-size:clamp(26px,5.4vw,46px);line-height:1;
  letter-spacing:.03em;font-variant-numeric:tabular-nums;color:var(--zhu);
}
.era small{font-size:.42em;color:var(--ink-2);margin-left:1px;letter-spacing:0}
.dyn{font-size:12px;color:var(--ink-2);margin-top:5px;letter-spacing:.08em}
.dyn b{font-family:var(--f-display);font-size:14px;color:var(--ink);letter-spacing:.04em}

/* ============ 地图 ============ */
.stage{position:relative;min-height:0;overflow:hidden;background:var(--paper)}
#map{display:block;width:100%;height:100%;touch-action:manipulation}
.stage-inner{position:relative;width:100%;height:100%}

.legend{
  position:absolute;right:10px;top:10px;z-index:3;background:rgba(232,227,214,.94);
  border:1px solid var(--line);padding:7px 8px 6px;font-size:10px;line-height:1.3;
  color:var(--ink-2);max-width:140px;
}
.legend b{display:block;font-family:var(--f-display);font-size:11px;color:var(--ink);letter-spacing:.14em;margin-bottom:5px}
.chb{fill:#23211C;fill-opacity:.05;stroke:none;pointer-events:none}
.chp{fill:none;stroke:#23211C;stroke-opacity:.10;stroke-width:.45;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.chc{fill:none;stroke:#23211C;stroke-opacity:.25;stroke-width:.95;stroke-linejoin:round;pointer-events:none}
.lg{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.lg i{width:9px;height:9px;flex:0 0 9px;border:1px solid rgba(0,0,0,.25)}

.hint{
  position:absolute;left:10px;bottom:8px;z-index:3;font-size:9.5px;color:var(--ink-3);
  font-family:var(--f-display);letter-spacing:.08em;pointer-events:none;text-align:left;
  line-height:1.45;max-width:46%;
}

/* ============ 时间轴 ============ */
.timeline{border-top:1px solid var(--line-2);padding:10px 16px 12px;background:var(--paper-2)}
.bands{position:relative;height:16px;margin-bottom:2px;border-bottom:1px solid var(--line-2)}
.band{position:absolute;top:0;height:16px;border-left:1px solid rgba(158,58,32,.35);cursor:pointer;transition:filter .18s}
.band:hover{filter:brightness(.93)}
.band.on{background:var(--zhu)!important;border-left-color:var(--zhu)}
.band-label{
  position:absolute;top:0;font-family:var(--f-display);font-size:10px;color:var(--ink-2);
  letter-spacing:.04em;transform-origin:left top;white-space:nowrap;pointer-events:none;
  padding-left:3px;line-height:16px;
}
.track{position:relative;padding:0}
input[type=range]{
  width:100%;margin:6px 0 0;accent-color:var(--zhu);height:26px;cursor:pointer;
  background:transparent;
}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.numwrap{display:flex;align-items:center;gap:5px;border:1px solid var(--line-2);padding:3px 7px;background:var(--paper)}
.numwrap label{font-size:11px;color:var(--ink-2);font-family:var(--f-display);letter-spacing:.08em}
#yearInput{
  width:76px;border:0;background:transparent;font-family:var(--f-num);font-size:16px;
  color:var(--ink);font-variant-numeric:tabular-nums;padding:2px 0;outline:none;
}
#yearInput::placeholder{color:var(--ink-3);font-size:12px;font-family:var(--f-body)}
.btn{
  font-family:var(--f-display);font-size:12px;letter-spacing:.1em;padding:5px 11px;
  border:1px solid var(--line-2);background:var(--paper);color:var(--ink-2);cursor:pointer;
  transition:background .16s,color .16s,border-color .16s;
}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.play{border-color:var(--zhu);color:var(--zhu)}
.btn.play.on{background:var(--zhu);color:var(--paper)}
.chips{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;flex:1 1 auto;min-width:0;scrollbar-width:thin}
.chips::-webkit-scrollbar{height:4px}
.chips::-webkit-scrollbar-thumb{background:var(--line-2)}
.tip{font-size:10.5px;color:var(--ink-3);font-family:var(--f-display);letter-spacing:.06em;flex:0 0 auto}
.chip{
  flex:0 0 auto;font-family:var(--f-display);font-size:12px;padding:3px 8px;cursor:pointer;
  border:1px solid transparent;color:var(--ink-2);background:transparent;letter-spacing:.06em;
  transition:all .15s;white-space:nowrap;
}
.chip:hover{background:var(--paper);border-color:var(--line-2);color:var(--ink)}
.chip.on{background:var(--zhu);color:var(--paper);border-color:var(--zhu)}

/* ============ 侧栏 ============ */
.side{
  background:var(--paper);border-left:1px solid var(--line-2);
  overflow-y:auto;overscroll-behavior:contain;padding:0 0 14px;
  scrollbar-width:thin;
}
.side::-webkit-scrollbar{width:5px}
.side::-webkit-scrollbar-thumb{background:var(--line-2)}
.panel{padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.kicker{font-family:var(--f-display);font-size:10.5px;letter-spacing:.22em;color:var(--ink-3)}
.back{font-size:11px;color:var(--zhu);cursor:pointer;background:none;border:0;padding:2px;font-family:var(--f-display);letter-spacing:.06em}
.back:hover{text-decoration:underline}
.p-name{font-family:var(--f-display);font-size:clamp(20px,2.4vw,26px);line-height:1.16;letter-spacing:.02em;margin-bottom:2px}
.p-alias{font-size:11.5px;color:var(--ink-3);margin-bottom:9px}
.p-meta{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 8px;font-size:12px;margin-bottom:11px}
.p-meta dt{color:var(--ink-3);font-family:var(--f-display);letter-spacing:.1em}
.p-meta dd{color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.p-tie{font-size:12.5px;color:var(--ink);line-height:1.68;padding:9px 0 4px;border-top:1px solid var(--line)}
.p-tie::before{
  content:"与中原";display:block;font-family:var(--f-display);font-size:10px;letter-spacing:.2em;
  color:var(--ink-3);margin-bottom:4px;
}
.sect{margin-top:12px}
.sect-h{
  font-family:var(--f-display);font-size:10px;letter-spacing:.2em;color:var(--ink-3);
  margin-bottom:6px;display:flex;align-items:center;gap:7px;
}
.sect-h::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
.person{display:flex;gap:8px;padding:5px 0;border-bottom:1px dotted var(--line);font-size:12px}
.person:last-child{border-bottom:0}
.p-year{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:11px;color:var(--zhu);flex:0 0 44px;padding-top:1px}
.p-body{min-width:0}
.p-body b{font-family:var(--f-display);font-size:12.5px;letter-spacing:.03em}
.p-body span{color:var(--ink-2);display:block;line-height:1.5}
.evt{padding:6px 0;border-bottom:1px dotted var(--line)}
.evt:last-child{border-bottom:0}
.evt-t{font-family:var(--f-display);font-size:12.5px;letter-spacing:.02em}
.evt-t em{font-family:var(--f-num);font-style:normal;color:var(--zhu);font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}
.evt-d{font-size:11.5px;color:var(--ink-2);line-height:1.55;margin-top:1px}

.near{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--paper-2)}
.near-h{font-family:var(--f-display);font-size:10px;letter-spacing:.2em;color:var(--ink-3);margin-bottom:7px}
.near-item{display:flex;gap:7px;font-size:11.5px;padding:3px 0;line-height:1.5}
.near-item i{font-family:var(--f-num);font-style:normal;color:var(--ink-3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.near-item .g{color:var(--zhu)}
.near-empty{font-size:11.5px;color:var(--ink-3)}

.roster{padding:12px 16px 0}
.r-group{margin-bottom:11px}
.r-head{display:flex;align-items:baseline;gap:6px;margin-bottom:5px}
.r-dot{width:7px;height:7px;flex:0 0 7px;border:1px solid rgba(0,0,0,.22)}
.r-name{font-family:var(--f-display);font-size:10.5px;letter-spacing:.16em;color:var(--ink-3)}
.chip2{
  display:inline-block;font-size:11.5px;padding:2px 7px;margin:0 3px 3px 0;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink-2);font-family:var(--f-display);
  letter-spacing:.03em;transition:all .14s;
}
.chip2:hover{border-color:var(--ink-2);color:var(--ink);background:var(--paper-2)}
.chip2.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.colophon{padding:14px 16px 0;font-size:10.5px;color:var(--ink-3);line-height:1.6;font-family:var(--f-display);letter-spacing:.03em}

/* ============ SVG 内部样式 ============ */
.sea{fill:var(--water)}
.land{fill:var(--paper);stroke:var(--line-2);stroke-width:1.05;stroke-linejoin:round}
.grid{stroke:var(--line);stroke-width:.5;fill:none;opacity:.5}
.grid-l{stroke:var(--line);stroke-width:.5;fill:none;opacity:.45;stroke-dasharray:1 3}
.river{fill:none;stroke:#8E9689;stroke-width:.9;opacity:.75;stroke-linecap:round}
.ridge{fill:none;stroke:var(--line-2);stroke-width:.9;opacity:.65}
.ent{cursor:pointer;transition:opacity .45s ease}
.ent path{stroke-width:1;transition:stroke-width .2s,fill-opacity .2s}
.ent:hover path{stroke-width:1.9}
.lbl{
  font-family:var(--f-display);font-size:var(--lbl,11px);fill:var(--ink);paint-order:stroke;
  stroke:var(--paper);stroke-width:calc(var(--lbl,11px) * .21);stroke-linejoin:round;pointer-events:none;
  transition:opacity .45s ease;letter-spacing:.02em;
}
.lbl.sm{font-size:calc(var(--lbl,11px) * .87);stroke-width:calc(var(--lbl,11px) * .18)}
.lbl.core{font-size:calc(var(--lbl,11px) * 1.38);font-weight:700;letter-spacing:.14em;fill:var(--zhu)}
.pulse{fill:none;stroke:var(--zhu);stroke-width:1.4;pointer-events:none}

@media (max-width:1019px){
  .head{padding:12px 14px 9px}
  .stage{height:clamp(270px,42vh,380px)}
  .side{border-left:0;border-top:1px solid var(--line-2);overflow:visible;padding-bottom:18px}
  .timeline{padding:9px 14px 11px}
  .legend{font-size:9.5px;max-width:126px;padding:6px 7px}
  .btn{padding:9px 13px}
  .chip{padding:7px 10px}
  .chip2{padding:6px 10px}
  #slider{height:32px}
  .numwrap{padding:5px 9px}
}
@media (min-width:1020px){
  .app{
    display:grid;grid-template-columns:minmax(0,1fr) 322px;
    grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"head head" "map side" "time time";
    height:100vh;max-height:100vh;
  }
  .head{grid-area:head}
  .stage{grid-area:map;height:auto}
  .side{grid-area:side;height:100%}
  .timeline{grid-area:time}
}
/* 帝王 / 名臣 */
.throne{
  display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;padding:8px 0 9px;
  border-bottom:1px solid var(--line);margin-bottom:2px;
}
.throne-k{font-family:var(--f-display);font-size:10px;letter-spacing:.2em;color:var(--ink-3)}
.throne-n{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--zhu);letter-spacing:.03em}
.throne-y{font-family:var(--f-num);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.throne-note{font-size:11.5px;color:var(--ink-2);line-height:1.5;margin-top:3px;width:100%}
.emp{padding:5px 0;border-bottom:1px dotted var(--line);font-size:12px}
.emp:last-child{border-bottom:0}
.emp-h{display:flex;align-items:baseline;gap:6px}
.emp-t{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.04em}
.emp-n{font-size:11.5px;color:var(--ink-2)}
.emp-y{font-family:var(--f-num);font-size:10.5px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.emp-d{font-size:11px;color:var(--ink-3);line-height:1.45;margin-top:1px}
.emp.now{background:rgba(158,58,32,.07);margin:0 -6px;padding:5px 6px;border-bottom-color:rgba(158,58,32,.25)}
.emp.now .emp-t,.emp.now .emp-n{color:var(--zhu)}
.min{display:flex;gap:7px;padding:4px 0;border-bottom:1px dotted var(--line);font-size:11.5px;line-height:1.5}
.min:last-child{border-bottom:0}
.min-y{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--ink-3);flex:0 0 40px;padding-top:2px}
.min-b{min-width:0}
.min-b b{font-family:var(--f-display);font-size:12px;letter-spacing:.03em;margin-right:5px}
.min-b span{color:var(--ink-2)}
.tabs{display:flex;gap:0;margin-top:12px;border-bottom:1px solid var(--line)}
.tab{
  font-family:var(--f-display);font-size:11.5px;letter-spacing:.08em;padding:5px 10px;cursor:pointer;
  background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);margin-bottom:-1px;
}
.tab.on{color:var(--zhu);border-bottom-color:var(--zhu)}
.tabbody{padding-top:8px}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">

  <header class="head">
    <div class="head-l">
      <div class="eyebrow">古代东亚世界 <span>/ 前 1046 — 1912</span></div>
      <div class="h1row">
        <h1>三千年的邻居</h1>
        <button class="btn play" id="playBtn" type="button">演进</button>
      </div>
      <p class="sub">以中原王朝为轴心，看周边政权的兴替与往来</p>
    </div>
    <div class="head-r">
      <div class="era" id="eraBig">前 1046<small>年</small></div>
      <div class="dyn" id="dynLine">中原：<b>西周</b></div>
    </div>
  </header>

  <div class="stage">
    <div class="stage-inner">
      <svg id="map" viewBox="-6 -6 919 494" preserveAspectRatio="xMidYMid meet" aria-label="古代东亚世界示意图">
        <g id="gSea"></g>
        <g id="gLand"></g>
        <g id="gChina"></g>
        <g id="gGrid"></g>
        <g id="gRivers"></g>
        <g id="gAreas"></g>
        <g id="gEntities"></g>
        <g id="gPulse"></g>
        <g id="gLabels"></g>
      </svg>
      <div class="legend" id="legend">
        <b>图 例</b>
        <div class="lg"><i style="background:#23211C;opacity:.26"></i>现代中国 · 省界参照</div>
        <div class="lg"><i style="background:#9E3A20"></i>中原王朝</div>
        <div class="lg"><i style="background:#63743F"></i>北方草原</div>
        <div class="lg"><i style="background:#3E6470"></i>东北</div>
        <div class="lg"><i style="background:#A7812F"></i>西域 · 中亚</div>
        <div class="lg"><i style="background:#6E5378"></i>西南 · 南亚</div>
        <div class="lg"><i style="background:#2A6A66"></i>海路贸易</div>
        <div class="lg"><i style="background:#494F6B"></i>远西</div>
      </div>
      <div class="hint">灰影与细线为今日中国省级界线，供对照；色块为势力范围示意，不作精确疆界</div>
    </div>
  </div>

  <aside class="side">
    <div class="panel" id="panel"></div>
    <div class="near" id="near"></div>
    <div class="roster" id="roster"></div>
    <div class="colophon">
      灰影与细线为今日中国省级行政界线，取自公开地理数据并作抽稀，用于比照古代疆域的今地范围；底图海岸线依现代轮廓简化。政权名称取其时通行称谓，存续年份多为史家通行的约数。
    </div>
  </aside>

  <div class="timeline">
    <div class="bands" id="bands"></div>
    <div class="track">
      <input type="range" id="slider" min="-1046" max="1912" step="1" value="-1046" aria-label="年代">
    </div>
    <div class="ctrl">
      <div class="numwrap">
        <label for="yearInput">年代</label>
        <input type="number" id="yearInput" value="-1046" step="1" aria-label="输入年代，负数为公元前">
      </div>
      <span class="tip">负数＝公元前</span>
      <div class="chips" id="chips"></div>
    </div>
  </div>

</div>
<script>
/* ===== 投影：等距圆柱，经度 26—152，纬度 57—-10 ===== */
var X0=26, Y0=57, S=7.2;
function PX(lon){return (lon-X0)*S}
function PY(lat){return (Y0-lat)*S}

/* ===== 底图经纬度数据（依现代轮廓简化） ===== */
var GEO={
  land:[[20,62],[26,60],[30,55],[40,62],[60,62],[80,62],[100,62],[120,62],[135,60],
  [142,56],[140,53],[139,51],[137,48],[135,45],[133,43.5],[131,43],[130,42.5],[129.5,41.5],[128.5,40.5],[127.5,39.5],
  [129.3,37.5],[129.2,35.2],[127.5,34.5],[126.5,34.6],[126.3,36],[126.6,37.4],[125.3,38.5],[124.8,39.6],[123.5,40.2],
  [122.2,40.6],[121,39.2],[119.3,39.9],[118,39],[119.2,37.6],[121,37.5],[122.5,37.4],[122.6,36.9],[121.3,36.5],[120.2,36],

  for(var lon=30;lon<=150;lon+=10){gg.appendChild(N('line',{x1:PX(lon),y1:PY(57).toFixed(1),x2:PX(lon),y2:PY(-10).toFixed(1),class:'grid'}))}
  for(var lat=0;lat<=50;lat+=10){gg.appendChild(N('line',{x1:PX(26).toFixed(1),y1:PY(lat),x2:PX(152).toFixed(1),y2:PY(lat),class:'grid'}))}
  gg.appendChild(N('line',{x1:PX(26).toFixed(1),y1:PY(23.5).toFixed(1),x2:PX(152).toFixed(1),y2:PY(23.5).toFixed(1),class:'grid-l'}));
  $('#gGrid').appendChild(gg);
  var rg=N('g',{});
  GEO.rivers.forEach(function(p){rg.appendChild(N('path',{d:polyPath(p,false),class:'river'}))});
  GEO.ridges.forEach(function(p){rg.appendChild(N('path',{d:polyPath(p,false),class:'ridge'}))});
  $('#gRivers').appendChild(rg);
}

/* ============ 今日中国：半透明暗影 + 省界 + 国界 ============ */
function buildChina(){
  if(typeof CHN==='undefined'||typeof CHP==='undefined')return;
  var g=$('#gChina'),i;
  for(i=0;i<CHN.length;i++)g.appendChild(N('path',{d:polyPath(CHN[i],true),class:'chb'}));
  for(i=0;i<CHP.length;i++)g.appendChild(N('path',{d:polyPath(CHP[i],true),class:'chp'}));
  for(i=0;i<CHN.length;i++)g.appendChild(N('path',{d:polyPath(CHN[i],true),class:'chc'}));
}

/* ============ 图层：中原疆域、周边政权 ============ */
function buildLayers(){
  CORE.forEach(function(c,i){
    var p=N('path',{d:polyPath(c.ext,true),fill:'#9E3A20','fill-opacity':0.09,
      stroke:'#9E3A20','stroke-opacity':0.5,'stroke-width':1.2});
    p.style.cursor='pointer';
    p.addEventListener('click',function(ev){ev.stopPropagation();pick('c'+i)});
    $('#gAreas').appendChild(p);areaG['c'+i]=p;
    var xy=CLBL[c.n]||[110,34];
    var t=N('text',{x:PX(xy[0]),y:PY(xy[1]),'text-anchor':'middle',class:'lbl core'});
    t.textContent=c.n;$('#gLabels').appendChild(t);lblG['c'+i]=t;
  });
  var cell={};
  FOREIGN.forEach(function(d,i){
    var cx=PX(d.x),cy=PY(d.y),r=d.r*S,col=GC[d.g];
    var ck=Math.floor(d.x/3)+','+Math.floor(d.y/3);
    var ck2=cell[ck]||0;cell[ck]=ck2+1;
    var g=N('g',{class:'ent'});
    var bp=blobPath(cx,cy,r,i*3+5);
    g.appendChild(N('path',{d:blobPath(cx,cy,r*1.2,i*3+5),fill:'none',stroke:col,
      'stroke-opacity':0.26,'stroke-width':0.85,'stroke-dasharray':'2.4 2.8','stroke-linecap':'round'}));
    g.appendChild(N('path',{d:bp,fill:col,'fill-opacity':0.19,
      stroke:col,'stroke-opacity':0.85,'stroke-width':1}));
    g.appendChild(N('circle',{cx:cx,cy:cy,r:Math.max(r*1.5,11),fill:'transparent'}));
    g.setAttribute('data-id','f'+i);
    g.addEventListener('click',function(ev){ev.stopPropagation();pick('f'+i)});
    $('#gEntities').appendChild(g);entG['f'+i]=g;
    var ty=(d.r>=2.4)?cy+4:cy-r-8-(ck2%4)*8;
    var t=N('text',{x:cx+((ck2%2)?7:-7),y:ty,'text-anchor':'middle',class:'lbl'+(d.r<1.35?' sm':'')});
    t.textContent=d.n;$('#gLabels').appendChild(t);lblG['f'+i]=t;
  });
}

/* ============ 查询 ============ */
function coreIndex(y){var m=-1;for(var i=0;i<CORE.length;i++){var c=CORE[i];if(y>=c.from&&y<=c.to)m=i}return m}
function findCore(y){var i=coreIndex(y);return i<0?null:CORE[i]}
function empAt(c,y){if(!c||!c.emp)return null;for(var i=0;i<c.emp.length;i++){var e=c.emp[i];if(y>=e[2]&&y<=e[3])return e}return null}
function alive(sel,y){
  if(!sel)return false;
  var i=+sel.slice(1),d=sel[0]==='c'?CORE[i]:FOREIGN[i];
  if(!d)return false;
  return sel[0]==='c'?(y>=d.from&&y<=d.to):(y>=d.f&&y<=d.t);
}

/* ============ 渲染 ============ */
function render(){
  var y=st.year;
  var c=findCore(y),ci=coreIndex(y),em=empAt(c,y);
  $('#eraBig').innerHTML=FMT(y)+'<small>年</small>';
  $('#dynLine').innerHTML='中原：<b>'+(c?c.n:'分裂过渡')+'</b>'+(em?'　'+em[0]+' '+em[1]:'');

  FOREIGN.forEach(function(d,i){
    var on=(y>=d.f&&y<=d.t),g=entG['f'+i],l=lblG['f'+i];
    g.style.opacity=on?1:0;g.style.pointerEvents=on?'auto':'none';
    l.style.opacity=on?1:0;
  });
  CORE.forEach(function(d,i){
    var on=(y>=d.from&&y<=d.to);
    areaG['c'+i].style.opacity=on?1:0;
    areaG['c'+i].style.pointerEvents=on?'auto':'none';
    lblG['c'+i].style.opacity=on?1:0;
  });

  if(st.sel&&!alive(st.sel,y))st.sel=null;
  paintSel();

  $('#slider').value=y;
  $('#yearInput').value=y;
  var onBand=-1;
  if(c)onBand=CORE.indexOf(c);
  var bands=$('#bands').children;
  for(var b=0;b<bands.length;b++){bands[b].classList.toggle('on',+bands[b].getAttribute('data-i')===onBand)}
  var chips=$('#chips').children;
  for(var k=0;k<chips.length;k++){chips[k].classList.toggle('on',+chips[k].getAttribute('data-y')===y)}

  renderPanel();renderNear();renderRoster();
}

function paintSel(){
  for(var k in entG){var p=entG[k].children[1];p.setAttribute('stroke-width',1);p.setAttribute('fill-opacity',0.19)}
  for(var k2 in areaG){areaG[k2].setAttribute('stroke-width',1.2);areaG[k2].setAttribute('fill-opacity',0.09)}
  if(!st.sel)return;
  if(st.sel.charAt(0)==='f'){
    var q=entG[st.sel];if(q){var e=q.children[1];e.setAttribute('stroke-width',2.6);e.setAttribute('fill-opacity',0.31)}
  }else{
    var r=areaG[st.sel];if(r){r.setAttribute('stroke-width',2.2);r.setAttribute('fill-opacity',0.17)}
  }
}

function pick(id){st.introStop=true;st.sel=id;render()}

/* ============ 侧栏：详情 ============ */
function renderPanel(){
  var y=st.year,c=findCore(y),ci=coreIndex(y),box=$('#panel');
  var sel=st.sel||(ci>=0?'c'+ci:null);
  if(!sel){box.innerHTML='<div class="panel-label"><span class="kicker">中原</span></div><div class="p-name">分裂过渡</div><p class="p-tie">此年中原无统一王朝，或处两朝交替之际。</p>';return}

  if(sel.charAt(0)==='c'){
    var d=CORE[+sel.slice(1)],em=empAt(d,y);
    var h='<div class="panel-label"><span class="kicker">中原王朝</span>'+
      '<span style="font-size:10.5px;color:var(--ink-3);letter-spacing:.06em">拖动时间轴看帝王更替</span></div>';
    h+='<div class="p-name">'+d.n+'</div>';
    h+='<div class="p-alias">'+(d.a?d.a+'　·　':'')+'都邑 '+d.cap+'　·　'+SPAN(d.from,d.to)+'</div>';
    if(em){
      h+='<div class="throne"><span class="throne-k">此年在位</span><span class="throne-n">'+em[0]+' '+em[1]+
         '</span><span class="throne-y">'+SPAN(em[2],em[3])+'</span><div class="throne-note">'+em[4]+'</div></div>';
    }else{
      h+='<div class="throne"><span class="throne-k">此年在位</span><span class="throne-n">—</span></div>';
    }
    h+='<p class="p-tie">'+d.tie+'</p>';
    h+='<div class="tabs"><button class="tab'+(st.tab==='emp'?' on':'')+'" data-tab="emp">帝王 '+(d.emp||[]).length+
       '</button><button class="tab'+(st.tab==='min'?' on':'')+'" data-tab="min">名臣 '+(d.min||[]).length+
       '</button><button class="tab'+(st.tab==='evt'?' on':'')+'" data-tab="evt">大事 '+(d.evt||[]).length+'</button></div>';
    h+='<div class="tabbody">';
    if(st.tab==='emp'){
      (d.emp||[]).forEach(function(e){
        var now=(y>=e[2]&&y<=e[3]);
        h+='<div class="emp'+(now?' now':'')+'"><div class="emp-h"><span class="emp-t">'+e[0]+'</span><span class="emp-n">'+e[1]+
           '</span><span class="emp-y">'+SPAN(e[2],e[3])+'</span></div><div class="emp-d">'+e[4]+'</div></div>';
      });
    }else if(st.tab==='min'){
      (d.min||[]).forEach(function(m){
        h+='<div class="min"><span class="min-y">'+FMT(m[1])+'</span><span class="min-b"><b>'+m[0]+'</b><span>'+m[2]+'</span></span></div>';
      });
    }else{
      (d.evt||[]).forEach(function(e){
        h+='<div class="evt"><div class="evt-t"><em>'+FMT(e[0])+'</em>'+e[1]+'</div><div class="evt-d">'+e[2]+'</div></div>';
      });
    }
    h+='</div>';
    box.innerHTML=h;
    return;
  }

  var f=FOREIGN[+sel.slice(1)];
  var h2='<div class="panel-label"><span class="kicker">周边 · '+(GN[f.g]||'')+'</span><button class="back" id="backCore">回中原 →</button></div>';
  h2+='<div class="p-name">'+f.n+'</div>';
  h2+='<div class="p-alias">'+(f.a?f.a:'')+'</div>';
  h2+='<dl class="p-meta"><dt>存续</dt><dd>'+SPAN(f.f,f.t)+'</dd><dt>今地</dt><dd>'+f.p+'</dd></dl>';
  h2+='<p class="p-tie">'+f.tie+'</p>';
  if(f.pp&&f.pp.length){
    h2+='<div class="sect"><div class="sect-h">人物</div>';
    f.pp.forEach(function(p){
      h2+='<div class="person"><span class="p-year">'+FMT(p[1])+'</span><span class="p-body"><b>'+p[0]+'</b><span>'+p[2]+'</span></span></div>';
    });
    h2+='</div>';
  }
  if(f.e&&f.e.length){
    h2+='<div class="sect"><div class="sect-h">大事</div>';
    f.e.forEach(function(e){
      h2+='<div class="evt"><div class="evt-t"><em>'+FMT(e[0])+'</em>'+e[1]+'</div><div class="evt-d">'+e[2]+'</div></div>';
    });
    h2+='</div>';
  }
  box.innerHTML=h2;
}

/* ============ 侧栏：此际大事 ============ */
function renderNear(){
  var y=st.year,list=[];
  CORE.forEach(function(c){(c.evt||[]).forEach(function(e){list.push({y:e[0],t:e[1],d:e[2],g:c.n})})});
  FOREIGN.forEach(function(f){(f.e||[]).forEach(function(e){list.push({y:e[0],t:e[1],d:e[2],g:f.n})})});
  list.sort(function(a,b){return Math.abs(a.y-y)-Math.abs(b.y-y)});
  var pick3=list.slice(0,3);
  var h='<div class="near-h">此际 · 前后最近的大事</div>';
  if(!pick3.length){h+='<div class="near-empty">无记载</div>'}
  pick3.forEach(function(e){
    var gap=e.y-y;
    var tag=gap===0?'本年':(gap<0?'前'+(-gap)+'年':'后'+gap+'年');
    h+='<div class="near-item"><i>'+FMT(e.y)+'</i><span><b class="g">'+e.t+'</b>　'+e.g+'　<span style="color:var(--ink-3)">('+tag+')</span></span></div>';
  });
  $('#near').innerHTML=h;
}

/* ============ 侧栏：当世交往对象 ============ */
function renderRoster(){
  var y=st.year,groups={};
  FOREIGN.forEach(function(d,i){if(y>=d.f&&y<=d.t){(groups[d.g]=groups[d.g]||[]).push({i:i,d:d})}});
  var order=['北疆','东北','西域','西南','海路','远西'];
  var h='';
  order.forEach(function(g){
    if(!groups[g])return;
    h+='<div class="r-group"><div class="r-head"><span class="r-dot" style="background:'+GC[g]+'"></span><span class="r-name">'+GN[g]+'</span></div>';
    groups[g].forEach(function(o){
      var on=(st.sel==='f'+o.i)?' on':'';
      h+='<button class="chip2'+on+'" data-id="f'+o.i+'">'+o.d.n+'</button>';
    });
    h+='</div>';
  });
  if(!h)h='<div class="near-empty">此年周边无可考政权</div>';
  $('#roster').innerHTML=h;
}

/* ============ 时间轴 ============ */
var CHIPS=[['西周',-900],['春秋战国',-500],['秦',-215],['西汉',-100],['东汉',100],['唐',700],['北宋',1050],['南宋',1200],['元',1300],['明',1500],['清',1800]];

function buildBands(){
  var w=$('#bands');w.innerHTML='';
  CORE.forEach(function(c,i){
    var pct=(c.to-c.from+1)/(FMAX-FMIN)*100;
    var b=document.createElement('div');
    b.className='band';b.setAttribute('data-i',i);
    b.style.left=((c.from-FMIN)/(FMAX-FMIN)*100)+'%';
    b.style.width=pct+'%';
    b.style.background=(i%2?'#C7BDA7':'#D6CDB9');
    b.addEventListener('click',function(){jump(+b.getAttribute('data-i'))});
    w.appendChild(b);
    if(pct>2.4){
      var s=document.createElement('div');
      s.className='band-label';s.style.left=b.style.left;s.textContent=c.n;
      w.appendChild(s);
    }
  });
}
function buildChips(){
  var w=$('#chips');w.innerHTML='';
  CHIPS.forEach(function(ch){
    var b=document.createElement('button');
    b.className='chip';b.type='button';b.setAttribute('data-y',ch[1]);b.textContent=ch[0];
    b.addEventListener('click',function(){setYear(ch[1])});
    w.appendChild(b);
  });
}
function jump(i){var c=CORE[i];if(c)setYear(Math.round((Math.max(c.from,-1000)+c.to)/2))}

function setYear(v,keepIntro){
  st.introStop=true;
  st.year=clamp(Math.round(v),FMIN,FMAX);
  render();
}

/* ============ 播放 ============ */
var rafId=null;
function stopPlay(){
  st.playing=false;st.paused=true;
  if(rafId)cancelAnimationFrame(rafId);rafId=null;
  $('#playBtn').textContent='演进';$('#playBtn').classList.remove('on');
}
function startPlay(){
  st.introStop=true;
  if(!st.paused&&st.year!==FMIN){st.year=FMIN;render()}
  st.paused=false;
  st.playing=true;st.acc=0;
  $('#playBtn').textContent='暂停';$('#playBtn').classList.add('on');
  var last=0;
  function tick(ts){
    if(!st.playing)return;
    if(!last)last=ts;
    st.acc+=ts-last;last=ts;
    if(st.acc>=34){
      st.acc-=34;
      st.year+=1;
      if(st.year>=FMAX){st.year=FMAX;render();stopPlay();st.paused=false;return}
      render();
    }
    rafId=requestAnimationFrame(tick);
  }
  rafId=requestAnimationFrame(tick);
}

/* ============ 视口 ============ */
function fitView(){
  var narrow=window.innerWidth<760;
  var vb=narrow?'278 0 612 392':'-6 -6 919 494';
  var svg=$('#map');
  svg.setAttribute('viewBox',vb);
  var cw=svg.getBoundingClientRect().width||600;
  var uw=narrow?612:919;
  var fs=Math.max(7,11*uw/cw);
  document.documentElement.style.setProperty('--lbl',fs.toFixed(2)+'px');
}

/* ============ 事件绑定 ============ */
function bind(){
  $('#slider').addEventListener('input',function(){setYear(+this.value)});
  $('#yearInput').addEventListener('change',function(){
    var v=parseFloat(this.value);
    if(isNaN(v)){this.value=st.year;return}
    setYear(v);
  });
  $('#yearInput').addEventListener('focus',function(){st.introStop=true});
  $('#playBtn').addEventListener('click',function(){
    if(st.playing)stopPlay();else startPlay();
  });
  $('#panel').addEventListener('click',function(ev){
    var t=ev.target;
    if(t.id==='backCore'){st.sel=null;render();return}
    var tab=t.getAttribute&&t.getAttribute('data-tab');
    if(tab){st.tab=tab;renderPanel();return}
  });
  $('#roster').addEventListener('click',function(ev){
    var id=ev.target.getAttribute&&ev.target.getAttribute('data-id');
    if(id)pick(id);
  });
  $('#map').addEventListener('click',function(){if(st.sel){st.sel=null;render()}});
  window.addEventListener('resize',fitView);
  document.addEventListener('keydown',function(ev){
    if(ev.target&&(ev.target.tagName==='INPUT'))return;
    if(ev.key==='ArrowRight'){setYear(st.year+1);ev.preventDefault()}
    if(ev.key==='ArrowLeft'){setYear(st.year-1);ev.preventDefault()}
  });
}

/* ============ 开场 ============ */
function intro(){
  st.year=FMIN;render();
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var svg=$('#map');
  if(reduce||!svg)return;
  svg.style.opacity='0';
  svg.style.transform='translateY(7px)';
  requestAnimationFrame(function(){
    svg.style.transition='opacity 1s cubic-bezier(.22,1,.36,1),transform 1.15s cubic-bezier(.22,1,.36,1)';
    svg.style.opacity='1';
    svg.style.transform='translateY(0)';
  });
}

/* ============ 启动 ============ */
buildBase();
buildChina();
buildLayers();
buildBands();
buildChips();
bind();
fitView();
st.year=FMIN;
render();
intro();
</script>
</body>
</html>
